<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slideshow</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#000;overflow:hidden;}

  .slideshow{
    position:relative;
    width:100vw;
    height:100vh;
  }

  .slideshow img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 1s ease-in-out;
  }

  .slideshow img.active{
    opacity:1;
  }
</style>
</head>
<body>

<div class="slideshow" id="slideshow"></div>

<script>
  // ==========================================================
  // EDIT THIS LIST — each image now has its own duration (seconds).
  // Bump a slide's number up if it's more important, or down if
  // it's less important / can flash by quicker.
  // ==========================================================
  const IMAGES = [
    { src: "Halloween_Special/carton.jpeg",            seconds: 6 },
    { src: "Halloween_Special/Copenhagen.jpeg",        seconds: 6 },
    { src: "Halloween_Special/zyn.jpeg",               seconds: 6 },
    { src: "Halloween_Special/Marlboro.jpeg",          seconds: 6 },
    { src: "Halloween_Special/velo_plus.jpeg",         seconds: 6 },
    { src: "Halloween_Special/vape.jpeg",              seconds: 6 },
    { src: "Halloween_Special/juul.jpeg",              seconds: 6 },
    { src: "Halloween_Special/Foger_pods.jpeg",        seconds: 6 },
    { src: "Halloween_Special/vuse.jpeg",              seconds: 6 },

//HardDRINKS FROM HERE

    { src: "Halloween_Special/barefoot.jpeg",          seconds: 4 },
    { src: "Halloween_Special/busch_light.jpeg",       seconds: 4 },
    { src: "Halloween_Special/carbliss.jpeg",          seconds: 4 },
    { src: "Halloween_Special/cutwater.jpeg",          seconds: 4 },
    { src: "Halloween_Special/michelob.jpeg",          seconds: 4 },
    { src: "Halloween_Special/miller.jpeg",            seconds: 4 },
    { src: "Halloween_Special/nonalc.jpeg",            seconds: 3 },
    { src: "Halloween_Special/oliver.jpeg",            seconds: 3 },

  //SoftDrinks/EnergyDrinks

    { src: "Halloween_Special/redbull.jpeg",           seconds: 6 },
    { src: "Halloween_Special/softdrinks.jpeg",        seconds: 6 },
    { src: "Halloween_Special/all_energy_drinks.jpeg", seconds: 4 },
    { src: "Halloween_Special/gato.jpeg",              seconds: 4 },
    { src: "Halloween_Special/ghost.jpeg",             seconds: 4 },
    { src: "Halloween_Special/Alani.jpeg",             seconds: 4 },
    { src: "Halloween_Special/monster.jpeg",           seconds: 6 },
//Misc

    { src: "Halloween_Special/live_bates.jpeg",        seconds: 3 },
    { src: "Halloween_Special/lottery.jpeg",           seconds: 3 },
  ];

  const container = document.getElementById("slideshow");

  // Build an <img> for every image in the list
  IMAGES.forEach((item, i) => {
    const img = document.createElement("img");
    img.src = item.src;
    if (i === 0) img.classList.add("active");
    container.appendChild(img);
  });

  const imgEls = container.querySelectorAll("img");
  let current = 0;

  function nextSlide(){
    imgEls[current].classList.remove("active");
    current = (current + 1) % imgEls.length;
    imgEls[current].classList.add("active");
    scheduleNext();
  }

  function scheduleNext(){
    const seconds = IMAGES[current].seconds;
    setTimeout(nextSlide, seconds * 1000);
  }

  scheduleNext();
</script>

</body>
</html>
